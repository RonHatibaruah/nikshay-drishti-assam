<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Shield Gradient -->
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f274a" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#060f1e" />
    </linearGradient>

    <!-- Vibrant Royal Blue Accent -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Warm Vitality Amber/Gold -->
    <linearGradient id="vitalityGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="navyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#030812" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Protective Sentinel Shield -->
  <path d="M50 4 L89 21 C89 61 50 96 50 96 C50 96 11 61 11 21 Z" 
        fill="url(#shieldNavy)" stroke="#2563eb" stroke-width="3.5" filter="url(#navyShadow)" />

  <!-- Inner Azure Accent Contour -->
  <path d="M50 11 L82 25 C82 57 50 87 50 87 C50 87 18 57 18 25 Z" 
        fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8" />

  <!-- Stylized Pulmonary Anatomy / Health Sentinel (Left & Right Lobes) -->
  <path d="M46 34 C41 30 31 32 31 45 C31 58 40 68 46 72 Z" 
        fill="url(#blueGlow)" opacity="0.9" />
  <path d="M54 34 C59 30 69 32 69 45 C69 58 60 68 54 72 Z" 
        fill="url(#blueGlow)" opacity="0.9" />

  <!-- Central Airway / Clinical Stem -->
  <line x1="50" y1="24" x2="50" y2="60" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="42" x2="42" y2="51" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="42" x2="58" y2="51" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Vitality Pulse / ECG Telemetry Wave in Amber Gold -->
  <path d="M24 50 L35 50 L40 40 L46 60 L52 43 L58 55 L63 50 L76 50" 
        fill="none" stroke="url(#vitalityGold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sentinel Telemetry Radar Node -->
  <circle cx="50" cy="24" r="4" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
</svg>
